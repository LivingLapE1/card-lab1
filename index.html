<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun English · 초등 영어 단어 게임</title>
<meta name="description" content="카드 뒤집기, 보석 게임, 듣고 고르기, 스피드 퀴즈로 영어 단어랑 친해지는 초등 영어 단어 게임">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/bars.css">
<link rel="stylesheet" href="css/screens/intro.css">
<link rel="stylesheet" href="css/screens/login.css">
<link rel="stylesheet" href="css/screens/select.css">
<link rel="stylesheet" href="css/screens/play.css">
<link rel="stylesheet" href="css/screens/dashboard.css">
<link rel="stylesheet" href="css/screens/lost.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M3.5 9h4l5-4v14l-5-4h-4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.8 5.8a9 9 0 0 1 0 12.4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c1 4 6.5 6.2 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.2 2-5.4 3.2-6.4 0 2.1 1 3.4 2.2 3.4 0-3.3-.1-5.6 1.1-8.5z" fill="currentColor"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="M11.3 11.7L20 3M16.5 6.5l3 3M14 9l2 2"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path d="M13 4H5v16h8M10 12h11M17 8l4 4-4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z" fill="var(--yellow)"/><path d="M12 9.5v5M12 17.6v.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

    <!-- 사과 (단어 그림 카드 예시) -->
    <symbol id="apple" viewBox="0 0 48 48">
      <g stroke="#141414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M24 15c-4-4-17-3-17 10 0 12 9 19 17 16 8 3 17-4 17-16 0-13-13-14-17-10z" fill="#ff4a1c"/>
        <path d="M24 15c0-5 1.5-8 4-10.5" fill="none"/>
        <path d="M26.5 9.5c3.5-5 9-5.5 12-4-2.5 4.5-7.5 6.5-12 4z" fill="#22a35a"/>
      </g>
      <ellipse cx="15" cy="23" rx="2.6" ry="5" fill="#fff" opacity=".75"/>
    </symbol>

    <!-- 01 메모리: 카드 두 장 -->
    <symbol id="art-memory" viewBox="0 0 120 96">
      <g stroke="#141414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <g transform="rotate(-12 44 47)">
          <rect x="26" y="20" width="44" height="62" rx="6" fill="#141414"/>
          <rect x="22" y="16" width="44" height="62" rx="6" fill="#2b4bff"/>
          <path d="M35 38c0-6 4-9.5 9-9.5s9 3.5 9 9c0 6-9 6.5-9 13" fill="none" stroke="#fffdf7" stroke-width="5"/>
          <path d="M44 60.5v.5" stroke="#fffdf7" stroke-width="6"/>
        </g>
        <g transform="rotate(9 78 48)">
          <rect x="60" y="21" width="44" height="62" rx="6" fill="#141414"/>
          <rect x="56" y="17" width="44" height="62" rx="6" fill="#fffdf7"/>
        </g>
      </g>
      <use href="#apple" x="62" y="28" width="32" height="32" transform="rotate(9 78 48)"/>
    </symbol>

    <!-- 02 보석: 깎은 보석 + 다른 모양 보석 -->
    <symbol id="art-jewel" viewBox="0 0 120 96">
      <g stroke="#141414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="65,15 97,37 87,87 43,87 33,37" fill="#0d0b14"/>
        <polygon points="60,10 92,32 82,82 38,82 28,32" fill="#ff4a1c"/>
        <polygon points="60,26 76,38 70,66 50,66 44,38" fill="#ff8f6b"/>
        <path d="M60 10V26M92 32L76 38M82 82L70 66M38 82L50 66M28 32L44 38" fill="none"/>
        <polygon points="99,66 106,56 113,66 106,80" fill="#ffd400"/>
        <path d="M99 66h14" fill="none" stroke-width="2.5"/>
        <path d="M20 6l3 8.5 8.5 3-8.5 3-3 8.5-3-8.5-8.5-3 8.5-3z" fill="#ffd400" stroke-width="2.5"/>
      </g>
      <polygon points="47,40 58,30 55,45" fill="#fff" opacity=".85"/>
    </symbol>

    <!-- 03 듣고 고르기: 스피커 -->
    <symbol id="art-listen" viewBox="0 0 120 96">
      <g stroke-linejoin="round" stroke-linecap="round">
        <path d="M22 42h14l20-16v52L36 62H22z" fill="#141414" stroke="#141414" stroke-width="3"/>
        <path d="M18 38h14l20-16v52L32 58H18z" fill="#ffd400" stroke="#141414" stroke-width="3"/>
        <g fill="none" stroke="#141414" stroke-width="10">
          <path d="M65 37c6 7 6 15 0 22"/><path d="M76 28c11 11 11 29 0 40"/><path d="M87 19c16 16 16 42 0 58"/>
        </g>
        <g fill="none" stroke="#fffdf7" stroke-width="4">
          <path d="M65 37c6 7 6 15 0 22"/><path d="M76 28c11 11 11 29 0 40"/><path d="M87 19c16 16 16 42 0 58"/>
        </g>
      </g>
      <ellipse cx="25" cy="44" rx="2.4" ry="4" fill="#fff" opacity=".8"/>
    </symbol>

    <!-- 04 스피드: 초시계 + 번개 -->
    <symbol id="art-speed" viewBox="0 0 120 96">
      <g stroke="#141414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="54" cy="58" r="30" fill="#141414"/>
        <rect x="44" y="11" width="12" height="11" rx="2" fill="#141414"/>
        <rect x="69" y="18" width="10" height="9" rx="2" fill="#141414" transform="rotate(40 74 22)"/>
        <circle cx="50" cy="54" r="30" fill="#fffdf7"/>
        <path d="M50 29v5M75 54h-5M50 79v-5M25 54h5" fill="none"/>
        <path d="M50 54V37M50 54l12 7" fill="none" stroke-width="4"/>
        <circle cx="50" cy="54" r="3.5" fill="#141414"/>
        <polygon points="96,26 80,56 92,56 84,88 112,50 99,50 106,26" fill="#141414" transform="translate(4 4)"/>
        <polygon points="96,26 80,56 92,56 84,88 112,50 99,50 106,26" fill="#ffd400"/>
      </g>
      <ellipse cx="36" cy="40" rx="5" ry="2.6" fill="#fff" opacity=".9" transform="rotate(-40 36 40)"/>
    </symbol>

    <!-- 마스코트 비트(Bit) -->
    <symbol id="bit" viewBox="0 0 160 170">
      <g stroke="#141414" stroke-width="3" stroke-linejoin="round">
        <rect x="20" y="16" width="132" height="100" rx="12" fill="#141414"/>
        <rect x="14" y="10" width="132" height="100" rx="12" fill="#fffdf7"/>
        <rect x="28" y="22" width="104" height="66" rx="6" fill="#2b2540"/>
        <rect x="66" y="110" width="28" height="14" fill="#e6d9bd"/>
        <rect x="28" y="130" width="116" height="30" rx="5" fill="#141414"/>
        <rect x="22" y="124" width="116" height="30" rx="5" fill="#ffd400"/>
        <rect x="96" y="96" width="36" height="6" rx="2" fill="#141414"/>
        <circle cx="29" cy="99" r="4.5" fill="#22a35a"/>
      </g>
      <g fill="#ffd400">
        <rect x="56" y="40" width="10" height="14"/><rect x="94" y="40" width="10" height="14"/>
      </g>
      <path d="M64 64h6v6h20v-6h6" fill="none" stroke="#ffd400" stroke-width="4"/>
      <g fill="#ff4a1c"><rect x="44" y="60" width="9" height="5"/><rect x="107" y="60" width="9" height="5"/></g>
      <path d="M34 28h22l-12 14H34z" fill="#fff" opacity=".12"/>
      <path d="M22 18h40" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      <g stroke="#141414" stroke-width="5">
        <path d="M34 134h10M50 134h10M66 134h10M82 134h10M98 134h10M114 134h10M42 144h76"/>
      </g>
    </symbol>
  </defs>
</svg>

</body>
</html>
